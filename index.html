<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IST STATION // GLOBAL HUB</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --neon: #00f2ff; --bg: #010409; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: white; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: 1s; }

        /* --- LOGIN & NODE SELECT --- */
        #login-screen { text-align: center; z-index: 5000; width: 100%; max-width: 400px; }
        .login-box { background: var(--glass); padding: 40px; border-radius: 30px; border: 1px solid rgba(0, 242, 255, 0.2); backdrop-filter: blur(20px); }
        select { width: 100%; background: #000; color: var(--neon); border: 1px solid var(--neon); padding: 12px; border-radius: 5px; margin-bottom: 25px; font-weight: 700; cursor: pointer; text-transform: uppercase; }

        /* --- MAIN UI (HIDDEN) --- */
        #station-ui { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        body.unlocked #station-ui { display: flex; animation: fadeIn 1s forwards; }
        body.unlocked #login-screen { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- STATION CORE --- */
        #timer-display { font-size: 12vw; font-weight: 900; color: var(--neon); text-shadow: 0 0 40px rgba(0, 242, 255, 0.4); }
        .controls { position: fixed; bottom: 50px; display: flex; gap: 20px; }
        button { background: var(--neon); color: black; border: none; padding: 12px 28px; border-radius: 50px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.75rem; }
        
        #sidebar-hub { position: fixed; left: 30px; top: 50%; transform: translateY(-50%); width: 220px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; }
        .hub-title { color: var(--neon); font-size: 0.6rem; letter-spacing: 3px; border-bottom: 1px solid #222; margin-bottom: 15px; padding-bottom: 5px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1 style="letter-spacing: 10px; color: var(--neon);">IST ELITE</h1>
            <p style="font-size: 0.6rem; opacity: 0.5; margin-bottom: 30px;">SELECT NEURAL ACCESS POINT</p>
            
            <select id="node-selector">
                <option value="KOCHI NODE">INDIA - KOCHI</option>
                <option value="LONDON NODE">UK - LONDON</option>
                <option value="NEW YORK NODE">USA - NEW YORK</option>
                <option value="DUBAI NODE">UAE - DUBAI</option>
            </select>

            <div id="g_id_onload" data-client_id="402132270232-qa1iikn30jd71a19rp0c14o9ee1njsps.apps.googleusercontent.com" data-callback="handleAuth"></div>
            <div class="g_id_signin" data-type="standard" data-shape="pill"></div>
            <button onclick="unlock()" style="margin-top: 20px; width: 100%; background: transparent; color: #444; border: 1px solid #222;">Offline Bypass</button>
        </div>
    </div>

    <div id="station-ui">
        <div id="sidebar-hub">
            <div class="hub-title">LEADERBOARD</div>
            <div style="font-size:0.8rem; margin-bottom:10px;">01. RITHIKA <span style="float:right">142H</span></div>
            <div style="font-size:0.8rem; color:var(--neon)">02. YOU <span style="float:right">0H</span></div>
            <div class="hub-title" style="margin-top:30px;">ACTIVE NODE</div>
            <div id="display-node" style="font-weight:bold; font-size:0.8rem;">---</div>
        </div>
        <div id="timer-display">25:00</div>
        <div class="controls">
            <button id="start-btn" onclick="toggleTimer()">Start Session</button>
            <button onclick="location.reload()" style="background:#111; color:white;">Exit Node</button>
        </div>
    </div>

    <script>
        let secLeft = 25 * 60, timerLoop, isRunning = false;
        function handleAuth(resp) { unlock(); }
        function unlock() {
            document.getElementById('display-node').textContent = document.getElementById('node-selector').value;
            document.body.classList.add('unlocked');
        }
        function toggleTimer() {
            if (isRunning) { clearInterval(timerLoop); } 
            else {
                timerLoop = setInterval(() => {
                    if (secLeft > 0) {
                        secLeft--;
                        let m = Math.floor(secLeft/60), s = secLeft%60;
                        document.getElementById('timer-display').textContent = `${m}:${s < 10 ? '0'+s : s}`;
                    }
                }, 1000);
            }
            isRunning = !isRunning;
            document.getElementById('start-btn').textContent = isRunning ? "Pause" : "Resume";
        }
    </script>
</body>
</html>
