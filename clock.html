<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IST STATION // FINAL LEGACY</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --neon: #00f2ff; --break: #00ff88; --bg: #010409; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        
        body { 
            margin: 0; background: var(--bg); color: white; font-family: 'Inter', -apple-system, sans-serif; 
            overflow-x: hidden; transition: 1.5s;
        }

        /* --- BACKGROUND AURA --- */
        body::before {
            content: ""; position: fixed; inset: 0;
            background: radial-gradient(circle at center, var(--neon) 0%, transparent 70%);
            z-index: 0; opacity: 0.1; animation: breathe 12s infinite ease-in-out; pointer-events: none;
        }
        @keyframes breathe { 0%, 100% { opacity: 0.05; } 50% { opacity: 0.15; } }

        /* --- AUTH SCREEN --- */
        #auth-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* --- MAIN LAYOUT --- */
        #main-content { opacity: 0; pointer-events: none; transition: 1s; }
        body.unlocked #main-content { opacity: 1; pointer-events: auto; }
        body.unlocked #auth-overlay { display: none; }

        section { min-height: 100vh; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 10; padding: 40px 20px; }

        /* --- THE STATION CORE --- */
        #station { justify-content: center; }
        #precision-clock { position: absolute; top: 30px; font-size: 2.5rem; font-weight: 800; letter-spacing: 2px; }
        #ghost-clock { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 16vw; font-weight: 900; color: rgba(255, 255, 255, 0.02); 
            white-space: nowrap; pointer-events: none; z-index: 1; 
        }

        /* PROGRESS RING & TIMER */
        .timer-container { position: relative; width: 450px; height: 450px; display: flex; align-items: center; justify-content: center; }
        .progress-ring-svg { position: absolute; transform: rotate(-90deg); width: 100%; height: 100%; }
        .ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 4; }
        .ring-progress { 
            fill: none; stroke: var(--neon); stroke-width: 4; stroke-linecap: round;
            stroke-dasharray: 1256; stroke-dashoffset: 1256; transition: stroke-dashoffset 1s linear; 
        }
        #timer-display { font-size: 8rem; font-weight: 900; color: var(--neon); text-shadow: 0 0 30px rgba(0, 242, 255, 0.3); z-index: 10; }

        /* --- CONTROL PANEL --- */
        .ui-panel {
            position: fixed; bottom: 30px; background: var(--glass); 
            backdrop-filter: blur(15px); padding: 20px 40px; border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.1); display: flex; gap: 15px; align-items: center; z-index: 1000;
        }
        button { 
            background: var(--neon); color: black; border: none; padding: 12px 25px; 
            border-radius: 50px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; transition: 0.3s;
        }
        button:hover { background: white; transform: translateY(-2px); }
        .btn-dark { background: rgba(255,255,255,0.1); color: white; }

        /* --- FREQUENCY BARS --- */
        .viz { position: absolute; bottom: 0; width: 100%; height: 25vh; display: flex; align-items: flex-end; justify-content: center; gap: 15px; pointer-events: none; }
        .bar { width: 25px; background: linear-gradient(to top, var(--neon), transparent); height: 5%; opacity: 0.15; border-radius: 4px; }
        .animating { animation: freq 1.5s infinite ease-in-out; }
        @keyframes freq { 0%, 100% { height: 10%; } 50% { height: 80%; opacity: 0.4; } }

        /* --- MANUAL & CREDITS --- */
        #manual { background: rgba(0,0,0,0.5); padding: 80px 20px; text-align: center; }
        .manual-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1000px; margin: 40px auto; }
        .manual-card { background: var(--glass); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        footer { padding: 40px; opacity: 0.4; font-size: 0.7rem; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <h2 style="letter-spacing: 10px; margin-bottom: 30px;">STATION IST</h2>
        <div id="g_id_onload"
             data-client_id="YOUR_CLIENT_ID_HERE.apps.googleusercontent.com"
             data-callback="onSignIn">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black"></div>
        <p style="margin-top: 20px; font-size: 0.6rem; opacity: 0.5;">SIGN IN TO ACTIVATE NEURAL LINK</p>
        <button class="btn-dark" style="margin-top: 10px;" onclick="bypass()">Developer Bypass (Skip Login)</button>
    </div>

    <div id="main-content">
        <section id="station">
            <div id="precision-clock">00:00:00</div>
            <div id="ghost-clock">12:00 AM</div>

            <div class="timer-container">
                <svg class="progress-ring-svg" viewBox="0 0 450 450">
                    <circle class="ring-bg" cx="225" cy="225" r="200"></circle>
                    <circle id="ring" class="ring-progress" cx="225" cy="225" r="200"></circle>
                </svg>
                <div id="timer-display">25:00</div>
            </div>

            <div class="ui-panel">
                <button id="start-btn" onclick="toggleTimer()">Start Session</button>
                <button class="btn-dark" onclick="tune(300)">+5m</button>
                <button class="btn-dark" onclick="tune(-300)">-5m</button>
                <button class="btn-dark" onclick="toggleFS()">Full Screen</button>
                <a href="#manual" style="text-decoration: none;"><button class="btn-dark">Manual</button></a>
            </div>

            <div id="viz-container" class="viz"></div>
        </section>

        <section id="manual">
            <h2 style="letter-spacing: 5px;">USER MANUAL</h2>
            <div class="manual-grid">
                <div class="manual-card"><h4>01. BREATHE</h4><p>Sync your pulse to the background aura glow.</p></div>
                <div class="manual-card"><h4>02. FOCUS</h4><p>Frequency bars jump when the timer is active.</p></div>
                <div class="manual-card"><h4>03. BREAK</h4><p>When the ring empties, get up and stretch.</p></div>
            </div>
            <footer>
                CREATED BY YOU & GEMINI // © 2026 IST ELITE
            </footer>
        </section>
    </div>

    <script>
        let secLeft = 25 * 60, totalSec = 25 * 60, timerLoop, isRunning = false;
        const ring = document.getElementById('ring');
        const circumference = 2 * Math.PI * 200;

        function onSignIn(response) { document.body.classList.add('unlocked'); init(); }
        function bypass() { document.body.classList.add('unlocked'); init(); }

        function init() {
            updateClocks();
            setInterval(updateClocks, 1000);
            createBars();
        }

        function updateClocks() {
            const now = new Date();
            document.getElementById('precision-clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
            document.getElementById('ghost-clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function toggleTimer() {
            const btn = document.getElementById('start-btn');
            if (isRunning) {
                clearInterval(timerLoop);
                btn.textContent = "Resume";
                document.querySelectorAll('.bar').forEach(b => b.classList.remove('animating'));
            } else {
                btn.textContent = "Pause";
                document.querySelectorAll('.bar').forEach(b => b.classList.add('animating'));
                timerLoop = setInterval(() => {
                    if (secLeft > 0) {
                        secLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerLoop);
                        alert("Session Complete.");
                    }
                }, 1000);
            }
            isRunning = !isRunning;
        }

        function tune(amt) { 
            secLeft = Math.max(0, secLeft + amt); 
            totalSec = isRunning ? totalSec : secLeft;
            updateDisplay(); 
        }

        function updateDisplay() {
            let m = Math.floor(secLeft / 60), s = secLeft % 60;
            document.getElementById('timer-display').textContent = `${m}:${s < 10 ? '0'+s : s}`;
            const offset = circumference - (secLeft / totalSec) * circumference;
            ring.style.strokeDashoffset = isNaN(offset) ? 0 : offset;
        }

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function createBars() {
            const container = document.getElementById('viz-container');
            for(let i=0; i<20; i++) {
                const b = document.createElement('div');
                b.className = 'bar';
                b.style.animationDuration = (1 + Math.random()) + 's';
                container.appendChild(b);
            }
        }
    </script>
</body>
</html>
